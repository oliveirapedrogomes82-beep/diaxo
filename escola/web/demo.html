<a class="skip" href="#" data-act="skip">Pular para o conteúdo</a>
<div id="screen"><div class="boot" role="status"><span class="brand-mark" aria-hidden="true"></span><span class="spinner" aria-hidden="true"></span><span>Carregando a Caderneta…</span></div></div>
<div class="app" id="app" hidden>
  <aside class="sidebar" id="sidebar" aria-label="Menu principal">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <div class="brand-text">
        <strong id="brandName">Escola</strong>
        <span id="brandYear"></span>
      </div>
      <button type="button" class="icon-btn side-close" data-act="close-menu" aria-label="Fechar menu"><span data-icon="x"></span></button>
    </div>
    <nav id="nav"></nav>
    <div class="side-foot">
      <button type="button" class="side-link" data-act="help"><span data-icon="help"></span>Atalhos e ajuda</button>
    </div>
  </aside>
  <div class="scrim" data-act="close-menu" hidden></div>

  <div class="main-col">
    <header class="topbar">
      <button type="button" class="icon-btn only-narrow" data-act="open-menu" aria-label="Abrir menu"><span data-icon="menu"></span></button>
      <button type="button" class="search-trigger" data-act="palette" aria-label="Buscar (Ctrl+K)">
        <span data-icon="search"></span>
        <span class="search-text">Buscar…</span>
        <kbd>Ctrl K</kbd>
      </button>
      <div class="top-actions">
        <button type="button" class="btn primary" data-act="new-menu" aria-haspopup="menu" hidden><span data-icon="plus"></span><span class="hide-xs">Novo</span></button>
        <button type="button" class="user-btn" id="userBtn" data-act="user-menu" aria-haspopup="menu" aria-label="Minha conta"></button>
      </div>
    </header>
    <div id="banner"></div>
    <main id="main" tabindex="-1"></main>
  </div>

  <nav class="tabbar" id="tabbar" aria-label="Atalhos"></nav>
</div>
<div id="layer"></div>
<div class="toasts" id="toasts" role="status" aria-live="polite"></div>
<div class="tip" id="tip" role="tooltip" hidden></div>
