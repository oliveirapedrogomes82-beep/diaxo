<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Caderneta Escolar</title>
<meta name="description" content="Administração escolar: alunos, turmas, chamada, notas, financeiro, agenda e comunicados em um só lugar.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Gabarito:wght@500;600;700&display=swap">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<a class="skip" href="#" data-act="skip">Pular para o conteúdo</a>
<div class="app">
  <aside class="sidebar" id="sidebar" aria-label="Menu principal">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <div class="brand-text">
        <strong id="brandName">Escola</strong>
        <span id="brandYear">Ano letivo</span>
      </div>
      <button class="icon-btn side-close" data-act="close-menu" aria-label="Fechar menu"></button>
    </div>
    <nav id="nav"></nav>
    <div class="side-foot">
      <button class="side-link" data-act="help"><span data-icon="help"></span>Atalhos e ajuda</button>
    </div>
  </aside>
  <div class="scrim" data-act="close-menu" hidden></div>

  <div class="main-col">
    <header class="topbar">
      <button class="icon-btn only-narrow" data-act="open-menu" aria-label="Abrir menu"><span data-icon="menu"></span></button>
      <button class="search-trigger" data-act="palette" aria-label="Buscar (Ctrl+K)">
        <span data-icon="search"></span>
        <span class="search-text">Buscar aluno, turma ou ação…</span>
        <kbd>Ctrl K</kbd>
      </button>
      <div class="top-actions">
        <button class="icon-btn" data-act="theme" aria-label="Mudar tema" id="themeBtn"></button>
        <button class="btn primary" data-act="new-menu" aria-haspopup="menu"><span data-icon="plus"></span><span class="hide-xs">Novo</span></button>
      </div>
    </header>
    <div id="banner"></div>
    <main id="main" tabindex="-1"></main>
  </div>

  <nav class="tabbar" id="tabbar" aria-label="Atalhos"></nav>
</div>
<div id="layer"></div>
<div class="toasts" id="toasts" role="status" aria-live="polite"></div>
<div class="tip" id="tip" role="tooltip" hidden></div>

<script src="js/util.js"></script>
<script src="js/icons.js"></script>
<script src="js/seed.js"></script>
<script src="js/store.js"></script>
<script src="js/ui.js"></script>
<script src="js/pages/painel.js"></script>
<script src="js/pages/alunos.js"></script>
<script src="js/pages/matricula.js"></script>
<script src="js/pages/professores.js"></script>
<script src="js/pages/turmas.js"></script>
<script src="js/pages/chamada.js"></script>
<script src="js/pages/notas.js"></script>
<script src="js/pages/financeiro.js"></script>
<script src="js/pages/agenda.js"></script>
<script src="js/pages/comunicados.js"></script>
<script src="js/pages/relatorios.js"></script>
<script src="js/pages/configuracoes.js"></script>
<script src="js/app.js"></script>
</body>
</html>
